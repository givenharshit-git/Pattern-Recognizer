<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pattern Recognition Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">⌁</span><div><b>PatRecLab</b><small>Pattern Recognition Lab</small></div></div>
      <button class="nav active" data-view="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav" data-view="patterns">◈ <span>Patterns</span></button>
      <button class="nav" data-view="problems">▤ <span>Problems</span></button>
      <button class="nav" data-view="decision">⌘ <span>Decision Guide</span></button>
      <button class="nav" data-view="progress">◔ <span>Progress</span></button>
      <div class="side-title">TECHNIQUES</div>
      <div id="techNav"></div>
      <div class="sidebar-foot">141-problem masterclass<br><span>Local progress · no account</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mobile-title">AlgoPattern</div>
        <label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search problems, patterns, techniques…"></label>
        <button id="themeBtn" class="icon-btn" title="Toggle theme">☼</button>
      </header>

      <section id="dashboard" class="view active"></section>
      <section id="patterns" class="view"></section>
      <section id="problems" class="view"></section>
      <section id="decision" class="view"></section>
      <section id="progress" class="view"></section>
    </main>
  </div>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
