<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pattern Recognition Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">⌁</span><div><b>PatRecLab</b><small>Pattern Recognition Lab</small></div></div>
      <button class="nav active" data-view="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav" data-view="patterns">◈ <span>Patterns</span></button>
      <button class="nav" data-view="problems">▤ <span>Problems</span></button>
      <button class="nav" data-view="decision">⌘ <span>Decision Guide</span></button>
      <button class="nav" data-view="progress">◔ <span>Progress</span></button>
      <button class="nav" data-view="patternmap">◎ <span>Pattern Map</span></button>
      <div class="side-title">TECHNIQUES</div>
      <div id="techNav"></div>
      <div class="sidebar-foot">
        141-problem masterclass<br>
        <span>Local progress · no account</span>
        <div class="author-section">
          <div class="author-title">Follow the Author</div>
          <div class="social-links">
            <a href="https://www.instagram.com/getharshit/" target="_blank" rel="noopener noreferrer" class="social-block">
              <span class="social-icon">📸</span>
              <span class="social-name">Instagram</span>
            </a>
            <a href="https://www.linkedin.com/in/harshitsoni-india/" target="_blank" rel="noopener noreferrer" class="social-block">
              <span class="social-icon">🔗</span>
              <span class="social-name">LinkedIn</span>
            </a>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="menu-btn" title="Toggle menu">☰</button>
        <div class="mobile-title">PatRecLab</div>
        <label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search problems, patterns, techniques…"></label>
        <button id="themeBtn" class="icon-btn" title="Toggle theme">☼</button>
      </header>

      <section id="dashboard" class="view active"></section>
      <section id="patterns" class="view"></section>
      <section id="problems" class="view"></section>
      <section id="decision" class="view"></section>
      <section id="progress" class="view"></section>
      <section id="patternmap" class="view"></section>
    </main>
  </div>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
